name: Deploy Deno

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: npx deployctl@latest deploy --project=freebuff-nova --token "$DENO_DEPLOY_TOKEN" server/adapters/deno.entry.js