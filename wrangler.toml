# Cloudflare Workers/Pages 部署配置（见 ARCHITECTURE.md 第 5 节部署矩阵）
# 需要先在 Cloudflare 控制台创建 D1 数据库，并把 database_id 填入下方。

name = "freebuff-nova"
main = "server/adapters/cloudflare.entry.js"
compatibility_date = "2025-01-01"

# 静态资源：优先使用 Cloudflare Pages（Functions + 静态托管）；
# 走 Workers 时可用 Workers Sites（下述 [site] bucket 指向 public/）。
# [site]
# bucket = "public"

# D1 数据库绑定（默认绑定名 DB，与 server/db/resolver.js 的探测逻辑一致）
[[d1_databases]]
binding = "DB"
database_name = "freebuff-nova"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 环境变量（敏感项走 wrangler secret put：ENCRYPTION_KEY / AUTH_PASSWORD_HASH）
[vars]
NODE_ENV = "production"